<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Compras</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="page-wrapper">

        <header class="header">
            <div class="header-icon" aria-hidden="true">🛒</div>
            <div>
                <h1>Lista de Compras</h1>
                <p class="subtitle">Organize o que falta pegar</p>
            </div>
        </header>

        <!-- Adicionar item -->
        <section class="add-section" aria-label="Adicionar item">
            <div class="add-item">
                <input
                    type="text"
                    id="item-input"
                    placeholder="Ex: Leite, Pão, Ovos…"
                    autocomplete="off"
                    aria-label="Nome do item"
                    maxlength="60"
                />
                <button id="add-button" aria-label="Adicionar item à lista">
                    <span class="btn-icon" aria-hidden="true">+</span>
                    <span>Adicionar</span>
                </button>
            </div>
            <p class="input-hint" id="input-hint" aria-live="polite"></p>
            <p class="summary-text" id="summary-text" aria-live="polite">Você tem 0 itens no total.</p>
        </section>

        <!-- Listas lado a lado -->
        <div class="lists-wrapper">

            <!-- Lista: Preciso Pegar -->
            <section class="list-section" aria-labelledby="preciso-titulo">
                <div class="list-header">
                    <h2 id="preciso-titulo">
                        <span class="list-icon" aria-hidden="true">📋</span>
                        Preciso Pegar
                    </h2>
                    <span class="badge" id="badge-preciso" aria-label="0 itens">0</span>
                </div>
                <ul id="lista-mercado" class="lista" aria-label="Itens a pegar">
                    <li class="empty-state" id="empty-preciso">
                        <span aria-hidden="true">🌿</span>
                        <p>Nenhum item na lista ainda.<br>Adicione algo acima!</p>
                    </li>
                </ul>
            </section>

            <!-- Lista: Itens Pegados -->
            <section class="list-section list-section--done" aria-labelledby="pegados-titulo">
                <div class="list-header">
                    <h2 id="pegados-titulo">
                        <span class="list-icon" aria-hidden="true">✅</span>
                        Já Peguei
                    </h2>
                    <span class="badge badge--done" id="badge-pegados" aria-label="0 itens">0</span>
                </div>
                <ul id="lista-pegados" class="lista" aria-label="Itens já pegados">
                    <li class="empty-state" id="empty-pegados">
                        <span aria-hidden="true">✨</span>
                        <p>Itens marcados como pegos<br>aparecerão aqui.</p>
                    </li>
                </ul>
                <button id="limpar-btn" class="limpar-btn" aria-label="Limpar todos os itens pegados" hidden>
                    🗑 Limpar lista
                </button>
            </section>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
