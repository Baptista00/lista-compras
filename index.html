<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de compras</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <img src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Cpath%20fill='%23b38b54'%20d='M12%2012h6l8%2028h30l6-18H22'/%3E%3Ccircle%20cx='24'%20cy='52'%20r='5'%20fill='%234b453d'/%3E%3Ccircle%20cx='48'%20cy='52'%20r='5'%20fill='%234b453d'/%3E%3Cpath%20fill='%23d8af7b'%20d='M18%2022h34l-4%2012H22z'/%3E%3C/svg%3E" alt="Carrinho de compras">
        <h1>Lista de Compras</h1>
    </header>
    <div class="container">
        <div class="add-item">
            <input type="text" id="item-input" placeholder="Digite o item para adicionar">
            <button id="add-button">Adicionar</button>
        </div>
        <ul id="lista-mercado">
            <li class="item">
                <button class="ja-peguei-button">Já peguei</button>
            </li>
        </ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
